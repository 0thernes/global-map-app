name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build bundle
        run: npm run build
      - name: Package zip
        run: node scripts/package.mjs --zip
      - name: Generate release checksums (SHA256SUMS)
        run: |
          TAG="${GITHUB_REF_NAME}"
          sha256sum "dist/global-map-app-${TAG}.zip" > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Create GitHub release with the zip and checksums attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="RELEASE_NOTES_${TAG}.md"
          [ -f "$NOTES" ] || NOTES=CHANGELOG.md
          gh release create "$TAG" "dist/global-map-app-${TAG}.zip" "dist/SHA256SUMS" --title "Global Map ${TAG}" --notes-file "$NOTES" --verify-tag
