name: Data source / new case
description: Propose a new case, site or dataset, or correct a value. A source URL and a grade are required.
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        Only sourced rows are accepted. Coordinates are never invented or jittered; give the location as precisely as
        the source allows and say how precise it is. Grading rules: docs/data-and-grading.md.
  - type: dropdown
    id: kind
    attributes:
      label: What is this?
      options: [New case, New reference site, New dataset / layer, Correction to an existing row]
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name / title
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Source URL (required)
      description: Primary source if possible (archive, official record, peer-reviewed paper, named witness testimony).
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: grade
    attributes:
      label: Proposed grade (required)
      options:
        - CIT (credible investigator / testimony: e.g. Hastings, Diana Pasulka, per docs/data-and-grading.md)
        - Official record (government or military archive)
        - ST (experiencer / witness statement)
        - TE (testimony, unverified)
        - Online claim (trail only)
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date (ISO, as precise as the source allows)
      placeholder: 1980-12-26 / 1980-12 / 1980
  - type: input
    id: coords
    attributes:
      label: Latitude, longitude (decimal degrees) and precision
      placeholder: 52.0896, 1.4417 (exact_site | within_1km | locality | region)
  - type: input
    id: coord_source
    attributes:
      label: Where the coordinates come from
      placeholder: e.g. the source's map, Wikipedia {{coord}}, OSM geocode of the named place
  - type: input
    id: licence
    attributes:
      label: Licence of the source / dataset
  - type: textarea
    id: notes
    attributes:
      label: Summary and notes
      description: Facts from the source only. No skeptic boilerplate, no speculation.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: The source supports every value above, and I have not invented or estimated any of them.
          required: true
