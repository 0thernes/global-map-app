name: Bug report
description: Something in the app is broken or wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL and parameters
      placeholder: index.html?tour=intro&audio=on
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Open DevTools (F12) > Console and paste any red errors.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
