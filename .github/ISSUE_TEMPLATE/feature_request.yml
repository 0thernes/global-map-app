name: Feature request
description: Suggest a feature, layer or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data it needs (with licence)
      description: If the feature needs a dataset, name it, link it and give its licence.
